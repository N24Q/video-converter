name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: Test and package (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            builder: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            builder: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Install FFmpeg and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - name: End-to-end tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npx playwright test
      - name: Package
        run: npx electron-builder --linux deb --${{ matrix.builder }} --publish never
      - name: Smoke-test the package installs
        run: |
          sudo apt-get install -y ./release/*.deb
          dpkg -s video-converter | grep -E '^(Status|Architecture|Version)'
          test -x "/opt/Video Converter/video-converter"
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: release/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Video Converter ${GITHUB_REF_NAME#v}" \
            --generate-notes
